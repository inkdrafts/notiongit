name = "notiongit"
main = "src/index.ts"
compatibility_date = "2026-08-31"
workers_dev = true
preview_urls = true

[vars]
GITHUB_APP_ID = "4798518"
GITHUB_APP_SLUG = "inkdrafts"

# Same live namespace as [env.production] below — this repo's top-level
# config and env.production share the Worker name "notiongit". Local
# development uses an isolated in-memory namespace automatically.
[[kv_namespaces]]
binding = "JOBS"
id = "59f940cb5bde46e0ad0a4fe4ccba5919"

# Create this queue once with `wrangler queues create notiongit-provisioning`.
[[queues.producers]]
binding = "PROVISIONING_QUEUE"
queue = "notiongit-provisioning"

# The handler currently retries messages until the durable job model is added.
[[queues.consumers]]
queue = "notiongit-provisioning"
max_batch_size = 10
max_batch_timeout = 5

# Non-production environments use separate resources and names.
[env.staging]
name = "notiongit-staging"
workers_dev = true

[env.staging.vars]
GITHUB_APP_ID = "4798518"
GITHUB_APP_SLUG = "inkdrafts"

[[env.staging.kv_namespaces]]
binding = "JOBS"
id = "be672c41171a41f287dc4ff1ca32ba24"

[[env.staging.queues.producers]]
binding = "PROVISIONING_QUEUE"
queue = "notiongit-staging-provisioning"

[[env.staging.queues.consumers]]
queue = "notiongit-staging-provisioning"
max_batch_size = 10
max_batch_timeout = 5

[env.production]
name = "notiongit"
workers_dev = true

[env.production.vars]
GITHUB_APP_ID = "4798518"
GITHUB_APP_SLUG = "inkdrafts"

[[env.production.kv_namespaces]]
binding = "JOBS"
id = "59f940cb5bde46e0ad0a4fe4ccba5919"

[[env.production.queues.producers]]
binding = "PROVISIONING_QUEUE"
queue = "notiongit-provisioning"

[[env.production.queues.consumers]]
queue = "notiongit-provisioning"
max_batch_size = 10
max_batch_timeout = 5
